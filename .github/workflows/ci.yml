name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

      - name: End-to-end, accessibility and link checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.x autorun --collect.staticDistDir=out --upload.target=temporary-public-storage
